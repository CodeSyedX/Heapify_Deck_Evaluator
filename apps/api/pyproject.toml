[project]
name = "deck-api"
version = "0.1.0"
description = "HTTP entry point for the Deck Evaluator"
requires-python = ">=3.14,<3.15"
dependencies = ["deck-core", "uvicorn[standard]>=0.37"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_api"]
