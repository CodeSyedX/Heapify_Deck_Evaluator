[project]
name = "deck-worker"
version = "0.1.0"
description = "Background worker entry point for the Deck Evaluator"
requires-python = ">=3.14,<3.15"
dependencies = ["deck-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_worker"]
