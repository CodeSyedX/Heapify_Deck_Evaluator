[project]
name = "deck-core"
version = "0.1.0"
description = "Domain, application and infrastructure code for the Deck Evaluator"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "fastapi>=0.120",
    "sqlalchemy[asyncio]>=2.0.44",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.17",
    "pgvector>=0.4",
    "procrastinate>=3.5",
    "structlog>=25.4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "aioboto3>=15.0",
    "valkey>=6.1",
    "python-pptx>=1.0.2",
    "pypdf>=6.0",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pillow>=11.0",
    "numpy>=2.3",
    "openpyxl>=3.1",
    "anthropic>=0.70",
    "openai>=2.0",
    "opentelemetry-api>=1.37",
    "opentelemetry-sdk>=1.37",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_core"]
